##############
### Logger ###
##############
logging:
  level:
    sql: WARN
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.flywaydb.core.internal.scanner: DEBUG

##############
### Server ###
##############
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

##############
### Spring ###
##############
spring:
  application:
    name: dev-item-comparison
  messages:
    encoding: UTF-8

##################
### Swagger UI ###
##################
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    resolve-schema-properties: true

###############
### Metrics ###
###############
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,metrics"
  metrics:
    tags:
      enabled: true